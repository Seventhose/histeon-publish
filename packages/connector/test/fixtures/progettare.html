<template data-histos="component" data-ref="concert-card" data-title="Scheda del concerto" data-props='{"titolo":{"type":"string"},"url":{"type":"url"},"giorno":{"type":"string"},"data":{"type":"string"},"luogo":{"type":"string"},"immagine":{"type":"image"},"larghezza":{"type":"number","default":640},"altezza":{"type":"number","default":400}}'>
<article class="concert-card">
  {#if props.immagine}<img class="concert-card__image" src={props.immagine} alt="" width={props.larghezza} height={props.altezza} loading="lazy">{/if}
  <h3 class="concert-card__title"><a class="concert-card__link" href={props.url}>{props.titolo}</a></h3>
  <p class="concert-card__meta"><time datetime={props.giorno}>{props.data}</time> · {props.luogo}</p>

<template data-histos="template" data-ref="site/page" data-role="page" data-title="Pagina"><Site.Header /><main class="page" id="contenuto">{@slot}</main><Site.Footer /></template>
<template data-histos="template" data-ref="site/articolo" data-role="single" data-title="Articolo"><Site.Header />
<main class="page" id="contenuto">

      <h1 class="post__title">{page.title}</h1>
      <p class="post__meta"><time datetime={page.publishedAt.date("Y-m-d")}>{page.publishedAt.date("j F Y")}</time></p>
    </header>
    <div class="post__content">{@slot}</div>
  </article>
</main>
<Site.Footer /></template>
<template data-histos="template" data-ref="site/concerto" data-title="Concerto"><Site.Header /><main class="page" id="contenuto"><article class="post"><h1 class="post__title">{page.title}</h1><p class="post__meta"><time datetime={page.fields.data.date("Y-m-d")}>{page.fields.data.date("j F Y")}</time> · {page.fields.luogo}</p><div class="post__content">{@slot}</div></article></main><Site.Footer /></template>
<template data-histos="template" data-ref="site/archivio" data-role="archive" data-title="Archivio"><Site.Header /><main class="page" id="contenuto"><h1>{page.title}</h1><section class="events" aria-labelledby="events-title"><h2 class="events__title" id="events-title">In programma</h2><ul class="events__list">{#loop main() as concerto}<li><ConcertCard titolo={concerto.title} url={concerto.url} giorno={concerto.fields.data.date("Y-m-d")} data={concerto.fields.data.date("j F Y")} luogo={concerto.fields.luogo} immagine={concerto.fields.locandina} /></li>{:else}<li class="events__empty">Nessun concerto in programma.</li>{/loop}</ul></section>{#if page.totalPages > 1}<nav aria-label="Pagine">{#loop page.pageLinks as l}<a href={l.url}>{l.number}</a>{/loop}</nav>{/if}{@slot}</main><Site.Footer /></template>
<template data-histos="template" data-ref="site/blog" data-role="home" data-title="Notizie"><Site.Header /><main class="page" id="contenuto"><h1>Notizie</h1><ul>{#loop main() as x}<li><a href={x.url}>{x.title}</a></li>{:else}<li>Nessuna notizia.</li>{/loop}</ul>{@slot}</main><Site.Footer /></template>
<template data-histos="template" data-ref="site/categoria" data-role="category" data-title="Categoria"><Site.Header /><main class="page" id="contenuto"><h1>{page.title}</h1><ul>{#loop main() as x}<li><a href={x.url}>{x.title}</a></li>{:else}<li>Nessuna notizia.</li>{/loop}</ul>{@slot}</main><Site.Footer /></template>

<template data-histos="page" data-slug="home" data-title="Home" data-template="site/page">
<section class="hero" aria-labelledby="hero-title">
  <div class="hero__body">
    <h1 class="hero__title" id="hero-title">Concerti d'organo in duomo, ogni domenica d'estate</h1>
    <p class="hero__lead">Ingresso libero, alle 21. Il programma cambia ogni settimana.</p>
    <a class="hero__action" href="/concerto/">Leggi il programma</a>
  </div>
  <img class="hero__image" src="asset:organo" alt="L'organo del duomo visto dalla navata" width="1600" height="1000" fetchpriority="high">
</section>
<section class="events" aria-labelledby="events-title">
  <h2 class="events__title" id="events-title">Prossimi concerti</h2>
  <ul class="events__list">
    {#loop prossimi_concerti() as concerto}
      <li><ConcertCard titolo={concerto.title} url={concerto.url} giorno={concerto.fields.data.date("Y-m-d")} data={concerto.fields.data.date("j F Y")} luogo={concerto.fields.luogo} immagine={concerto.fields.locandina} /></li>
    {:else}
      <li class="events__empty">Nessun concerto in programma. Torna a trovarci presto.</li>
    {/loop}
  </ul>
  <p><a class="events__all" href="/concerto/">Tutti i concerti</a></p>
</section>
<section class="faq" aria-labelledby="faq-title">
  <h2 class="faq__title" id="faq-title">Domande frequenti</h2>
  <details class="faq__item" name="faq">
    <summary class="faq__question">Serve la prenotazione?</summary>
    <div class="faq__answer"><p>No, l'ingresso è libero fino a esaurimento dei posti.</p></div>
  </details>
</section>

<template data-histos="page" data-slug="chi-siamo" data-title="Chi siamo" data-template="site/page"><h1>Chi siamo</h1><p>Il coro canta musica sacra del Cinquecento.</p></template>
<template data-histos="page" data-slug="contatti" data-title="Contatti" data-template="site/page">
<h1>Contatti</h1>
<form class="contact-form" action="/contatti/" method="post">
  <div class="contact-form__field">
    <label class="contact-form__label" for="cf-nome">Nome e cognome</label>
    <input class="contact-form__input" id="cf-nome" name="nome" type="text" autocomplete="name" required>
  </div>
  <div class="contact-form__field">
    <label class="contact-form__label" for="cf-email">Email</label>
    <input class="contact-form__input" id="cf-email" name="email" type="email" autocomplete="email" required aria-describedby="cf-email-aiuto">
    <p class="contact-form__help" id="cf-email-aiuto">Ti rispondiamo a questo indirizzo.</p>
  </div>
  <div class="contact-form__field">
    <label class="contact-form__label" for="cf-messaggio">Messaggio</label>
    <textarea class="contact-form__input" id="cf-messaggio" name="messaggio" rows="6" required></textarea>
  </div>
  <button class="contact-form__submit" type="submit">Invia la richiesta</button>
</form>
</template>
<template data-histos="page" data-slug="privacy" data-title="Privacy" data-template="site/page"><h1>Privacy</h1><p>[testo da scrivere]</p></template>
<template data-histos="page" data-slug="cookie" data-title="Cookie" data-template="site/page"><h1>Cookie</h1><p>[testo da scrivere]</p></template>
<template data-histos="post" data-slug="stagione-2026" data-title="La stagione 2026" data-status="published" data-published-at="2026-05-10T09:00:00Z" data-excerpt="Il programma dei concerti dell'estate." data-terms='{"category":["notizie"]}'><p>Quest'estate il coro canta in duomo ogni domenica.</p><h2>Il programma</h2><p>Vespri, messe e mottetti del Cinquecento.</p></template>
